# gcloud builds submit --region REGION --substitutions _REGION=...,_SUPABASE_URL=...,_SUPABASE_PUBLISHABLE_KEY=...,_SITE_URL=...
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/kinconnect/app
      - --build-arg
      - NEXT_PUBLIC_SUPABASE_URL=${_SUPABASE_URL}
      - --build-arg
      - NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${_SUPABASE_PUBLISHABLE_KEY}
      - --build-arg
      - NEXT_PUBLIC_SITE_URL=${_SITE_URL}
      - .
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/kinconnect/app
substitutions:
  _REGION: us-central1
