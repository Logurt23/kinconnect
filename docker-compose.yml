# Local stand-ins for the GCP pieces: Postgres (Cloud SQL), PostgREST (the Cloud Run sidecar) and
# fake-gcs-server (Cloud Storage). The Identity Platform stand-in is the Firebase Auth emulator:
#   npx firebase-tools emulators:start --only auth --project demo-kinconnect
# See "Run locally" in the README.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["54322:5432"]
  postgrest:
    image: postgrest/postgrest:v16.4
    depends_on: [db]
    restart: unless-stopped # until `npm run db:migrate` has created the authenticator role
    environment:
      PGRST_DB_URI: postgres://authenticator:authenticator-local@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: local-dev-jwt-secret-at-least-32-characters-long
      PGRST_SERVER_PORT: "3001"
    ports: ["3001:3001"]
  gcs:
    image: fsouza/fake-gcs-server:1.56.1
    command: ["-scheme", "http", "-port", "4443", "-public-host", "127.0.0.1:4443", "-backend", "memory"]
    ports: ["4443:4443"]
