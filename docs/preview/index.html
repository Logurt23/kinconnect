<meta charset="utf-8">
<title>KinConnect Preview</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: the app's own shell. Sidebar at desktop width, top bar + bottom tab bar + More sheet on phones.
   Tokens copied from src/app/globals.css; the real app is light-only, so this preview is too. */
:root{
  --brand:#0f766e;--brand-dark:#115e59;--brand-soft:#e6f4f1;--extended:#7c3aed;
  --ink:#1c1917;--canvas:#faf7f2;--line:#ebe5da;--muted:#6b6560;--danger:#c81e1e;--warn:#b45309;
  --white:#ffffff;--amber-50:#fffbeb;--amber-100:#fef3c7;--amber-200:#fde68a;--red-50:#fef2f2;
  --yellow:#facc15;--yellow-dark:#ca8a04;--yellow-50:#fefce8;--yellow-900:#713f12;
  --orange:#f97316;--orange-dark:#c2410c;--orange-50:#fff7ed;--orange-800:#9a3412;
  --green:#16a34a;--green-50:#f0fdf4;--green-800:#166534;
  --sky:#0ea5e9;--sky-50:#f0f9ff;--sky-800:#075985;--violet:#8b5cf6;--violet-50:#f5f3ff;--violet-800:#5b21b6;
  --stone-100:#f5f5f4;--stone-300:#d6d3d1;--bubble-me:#0f766e;--bubble-them:#ffffff;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 1px 2px rgb(28 25 23/.04),0 6px 20px rgb(28 25 23/.06);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--canvas);color:var(--ink);font-family:var(--font);font-size:15px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--canvas)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
:focus-visible{outline:3px solid rgb(15 118 110/.35);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.preview-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-block:9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--ink);color:#f5f5f4;font-size:13px}
.preview-bar .sp{flex:1}
.toggle{display:inline-flex;align-items:center;gap:8px;background:rgb(255 255 255/.12);border:0;border-radius:999px;padding:5px 12px;color:#f5f5f4;font-size:13px;font-weight:600}
.toggle[aria-pressed="true"]{background:var(--warn);color:#fff}

.shell{display:flex;min-height:100%}
.side{display:none;width:256px;flex-shrink:0}
.side-in{position:sticky;top:0;height:100vh;overflow-y:auto;padding:24px 16px;display:flex;flex-direction:column}
.wordmark{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.01em;padding:0 8px;background:none;border:0}
.wordmark b{color:var(--brand);font-weight:800}
.side nav{margin-top:24px;flex:1;display:flex;flex-direction:column;gap:2px}
.nav-g{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:14px 16px 4px}
.nav-a{padding:8px 16px!important}
.sheet-g{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:4px 0 -4px}
.nav-a{display:flex;align-items:center;gap:12px;border:0;background:none;border-radius:999px;padding:9px 16px;font-size:15px;font-weight:600;color:rgb(28 25 23/.75);text-align:left;width:100%}
.nav-a:hover{background:var(--white);color:var(--ink)}
.nav-a[aria-current="page"]{background:var(--brand);color:#fff}
.nav-a .badge{margin-left:auto}
.badge{min-width:20px;border-radius:999px;background:var(--danger);padding:0 6px;text-align:center;font-size:11px;line-height:20px;font-weight:700;color:#fff}
.me-card{margin-top:16px;display:flex;align-items:center;gap:12px;border-radius:16px;background:var(--white);padding:12px;box-shadow:var(--shadow)}
.me-card .t{min-width:0;flex:1}
.me-card .t b{display:block;font-size:14px}.me-card .t small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;background:var(--amber-200);font-size:12px;font-weight:800;flex-shrink:0;width:36px;height:36px;color:var(--ink)}

.main{flex:1;min-width:0}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgb(250 247 242/.92);backdrop-filter:blur(8px);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar .wordmark{padding:0;font-size:17px;gap:8px}
.topbar .r{display:flex;align-items:center;gap:8px}
.content{max-width:1100px;margin:0 auto;padding-block:8px 132px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}

.tabbar{position:fixed;inset:auto 0 0;z-index:40;border-top:1px solid var(--line);background:rgb(255 255 255/.96);backdrop-filter:blur(8px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar .g{max-width:512px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 8px;border:0;background:none;font-size:11px;font-weight:600;color:var(--muted)}
.tab .pillbg{display:flex;align-items:center;justify-content:center;height:32px;width:56px;border-radius:999px}
.tab[aria-current="page"]{color:var(--brand)}
.tab[aria-current="page"] .pillbg{background:var(--brand-soft)}
.tab .badge{position:absolute;top:6px;left:50%;margin-left:8px}

.sheet-bg{position:fixed;inset:0;z-index:50;background:rgb(28 25 23/.42);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow-y:auto;background:var(--canvas);border-radius:28px 28px 0 0;padding:12px 20px max(env(safe-area-inset-bottom,0px),20px);animation:up .22s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:14px}
@media (min-width:1024px){.sheet-bg{align-items:center}.sheet{border-radius:24px;max-height:86vh}}
.sheet.still{animation:none}
.sheet:focus{outline:none}
.sheet h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.grab{margin:0 auto 2px;height:6px;width:40px;border-radius:999px;background:var(--line);flex-shrink:0}
.sheet-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sheet-grid button{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;border-radius:16px;padding:12px 4px;font-size:12px;font-weight:600;background:var(--white);box-shadow:var(--shadow);position:relative}
.sheet-grid button[aria-current="page"]{background:var(--brand);color:#fff}
.sheet-grid .badge{position:absolute;top:6px;right:8px}

@media (min-width:1024px){.side{display:block}.topbar,.tabbar{display:none}.content{padding-block:24px 48px}}

.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:8px}
.ph .ic{display:none;margin-bottom:8px;width:40px;height:40px;align-items:center;justify-content:center;border-radius:16px;background:var(--brand-soft);color:var(--brand)}
@media (min-width:1024px){.ph .ic{display:flex}}
.ph h1{margin:0;font-size:28px;line-height:1.15;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.ph p{margin:2px 0 0;font-size:15px;color:var(--muted);max-width:62ch}
.card{border-radius:16px;background:var(--white);box-shadow:var(--shadow);min-width:0}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px 18px 4px}
.sec-h h2{margin:0;font-size:17px;font-weight:700}
.lnk{font-size:12px;font-weight:600;color:var(--brand);background:none;border:0;padding:4px 0}
.sec-b{padding:8px 18px 18px}
.grid2{display:grid;grid-template-columns:1fr;gap:20px}
@media (min-width:1280px){.grid2{grid-template-columns:1fr 1fr}}
.muted{color:var(--muted)}.sm{font-size:14px}.xs{font-size:12px}
ul.plain{list-style:none;margin:0;padding:0}
ul.div>li{padding:10px 0;border-top:1px solid var(--line)}ul.div>li:first-child{border-top:0;padding-top:0}ul.div>li:last-child{padding-bottom:0}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.btn{display:inline-flex;min-height:44px;align-items:center;justify-content:center;gap:8px;border-radius:999px;border:0;padding:8px 20px;font-size:15px;font-weight:700;transition:transform .1s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn-p{background:var(--brand);color:#fff}.btn-p:hover{background:var(--brand-dark)}
.btn-s{background:var(--white);box-shadow:var(--shadow),inset 0 0 0 1px var(--line)}
.btn-d{background:var(--danger);color:#fff}.btn-w{background:var(--warn);color:#fff}
.btn-y{background:var(--yellow);color:var(--yellow-900)}.btn-y:hover{background:#eab308}
.btn-o{background:var(--orange-dark);color:#fff}
.btn-sm{display:inline-flex;min-height:36px;align-items:center;gap:6px;border-radius:999px;background:var(--white);border:1px solid var(--line);padding:0 14px;font-size:13px;font-weight:600;white-space:nowrap}
.btn-sm.p{background:var(--brand);border-color:var(--brand);color:#fff}
@media (min-width:640px){.btn{min-height:40px;font-size:14px}.btn-sm{min-height:32px;font-size:12px}}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.core{background:var(--brand);color:#fff}.ext{border:1px dashed var(--extended);background:rgb(124 58 237/.1);color:var(--extended)}
.branch{background:var(--cbg,rgb(28 25 23/.05));color:var(--cfg,var(--ink));box-shadow:inset 0 0 0 1px var(--cfg,rgb(28 25 23/.15))}

.storm{border:2px solid var(--warn);background:var(--amber-50);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.storm h2{margin:0;display:flex;gap:8px;align-items:center;font-size:18px;font-weight:800;color:var(--warn)}
.storm p{margin:0}
.cap{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);margin:0 0 4px}
.banner{display:flex;align-items:flex-start;gap:12px;border-radius:12px;border:2px solid var(--warn);background:var(--amber-50);padding:14px 16px;color:var(--warn);text-align:left;width:100%}
.banner.t-low{border-color:var(--yellow-dark);background:var(--yellow-50);color:var(--yellow-900)}
.banner.t-medium{border-color:var(--orange);background:var(--orange-50);color:var(--orange-800)}
.banner.t-high{border-color:var(--orange-dark);background:#ffedd5;color:var(--orange-dark)}
.banner.red{border-color:var(--danger);background:var(--red-50);color:var(--danger)}
.banner .lbl{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.banner .msg{display:block;font-weight:600;color:var(--ink)}
.banner .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.banner .sub{display:block;font-size:12px;color:var(--muted);margin-top:2px}

.tiles{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:640px){.tiles{grid-template-columns:1fr 1fr}}
@media (min-width:1024px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:16px;padding:12px;background:var(--white)}
.tile.sos{border-color:var(--danger)}
.tile .t{min-width:0;flex:1}.tile .t b{display:block;font-size:14px}
.tile .sub{display:block;font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tav{position:relative;flex-shrink:0}
.tav .av{width:44px;height:44px;background:var(--brand-soft);color:var(--brand);font-size:14px;font-weight:700}
.tav .dot{position:absolute;right:-2px;bottom:-2px;width:16px;height:16px;border-radius:999px;box-shadow:0 0 0 2px var(--white)}
.st-btn{display:inline-flex;min-height:36px;align-items:center;gap:6px;border-radius:999px;border:0;padding:0 14px;font-size:13px;font-weight:600}
.st-btn .d{width:10px;height:10px;border-radius:999px}
.st-btn.on{box-shadow:inset 0 0 0 2px currentColor}
.icbtn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:999px;border:0;background:none;color:var(--muted)}
.icbtn:hover{background:var(--white);color:var(--ink)}

.lst{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:640px){.lst{grid-template-columns:1fr 1fr}}
@media (min-width:1024px){.lst{grid-template-columns:repeat(3,1fr)}}
.lst .it{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--white);text-align:left;width:100%}
.lst .it b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.ev{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.ev .d{margin-top:6px;width:10px;height:10px;border-radius:999px;flex-shrink:0}
.ev .when{display:block;font-size:12px;color:var(--muted)}
@media (min-width:640px){.ev .when{display:inline-block;width:150px;font-size:14px}}

.poll{border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.poll .q{font-weight:700}
.opt{position:relative;display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--white);font-size:14px;font-weight:600;overflow:hidden;text-align:left;width:100%}
.opt .bar{position:absolute;inset:0 auto 0 0;background:var(--brand-soft);z-index:0;transition:width .3s}
.opt span{position:relative;z-index:1}
.opt.mine{border-color:var(--brand)}

.glist{border-radius:16px;background:var(--white);box-shadow:var(--shadow)}
.glist-h{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:16px 18px;text-align:left}
.glist-h .t{flex:1;min-width:0}.glist-h .t b{display:block;font-size:17px}
.glist-h .chev{transition:transform .2s;color:var(--muted)}
.glist[data-open="false"] .chev{transform:rotate(-90deg)}
.glist-b{padding:0 18px 18px}
.prog{height:6px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:8px}.prog i{display:block;height:100%;background:var(--brand)}
.groc li{display:flex;align-items:center;gap:12px}
.chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--stone-300);background:var(--white);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;padding:0}
.chk.on{background:var(--brand);border-color:var(--brand)}
.groc .nm{flex:1;min-width:0}
.groc .done b{text-decoration:line-through;color:var(--muted)}
.cart-h{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}

table.t{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.t th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:0 8px 8px 0}
table.t td{border-top:1px solid var(--line);padding:9px 8px 9px 0;vertical-align:middle}
.scroll{overflow-x:auto}

.cal{display:grid;grid-template-columns:repeat(7,minmax(84px,1fr));gap:6px;min-width:620px}
.cal .day{background:var(--white);border-radius:12px;padding:8px;min-height:120px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px}
.cal .day h4{margin:0 0 2px;font-size:12px;color:var(--muted);font-weight:700}
.cal .day.today{box-shadow:var(--shadow),inset 0 0 0 2px var(--brand)}
.cal .e{font-size:11px;font-weight:600;border-radius:6px;padding:3px 6px;color:#fff}
.input{min-height:44px;width:100%;border-radius:12px;border:1px solid var(--line);background:var(--white);padding:8px 14px;font:inherit;font-size:16px;color:var(--ink)}
textarea.input{min-height:80px;resize:vertical}
@media (min-width:640px){.input{min-height:40px;font-size:14px}}
.label{display:block;margin-bottom:6px;font-size:13px;font-weight:600;color:var(--muted)}
.notice{border-radius:16px;padding:12px 16px;font-size:14px;font-weight:600;background:var(--brand-soft);color:var(--brand-dark)}
.file{display:flex;align-items:center;gap:12px}
.file .t{flex:1;min-width:0}.file .t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{height:8px;border-radius:999px;background:var(--line);overflow:hidden}.meter i{display:block;height:100%;background:var(--brand)}

/* chips for picking people and circles */
.chip{display:inline-flex;align-items:center;gap:8px;min-height:40px;border-radius:999px;border:1px solid var(--line);background:var(--white);padding:0 14px 0 6px;font-size:14px;font-weight:600}
.chip .av{width:28px;height:28px;font-size:11px}
.chip[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-dark)}
.chip.c{padding:0 14px}
.chip.c .sw{width:12px;height:12px;border-radius:999px}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tier{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;border-radius:16px;border:2px solid var(--line);background:var(--white);padding:12px}
.tier b{font-size:15px}.tier span{font-size:12px;color:var(--muted);line-height:1.35}
.tier .sw{width:14px;height:14px;border-radius:999px}
.tier[aria-pressed="true"].low{border-color:var(--yellow-dark);background:var(--yellow-50)}
.tier[aria-pressed="true"].medium{border-color:var(--orange);background:var(--orange-50)}
.tier[aria-pressed="true"].high{border-color:var(--orange-dark);background:#ffedd5}

/* Enigma */
.e2e{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--brand)}
.chat-wrap{display:grid;grid-template-columns:1fr;gap:16px;min-height:0}
@media (min-width:900px){.chat-wrap{grid-template-columns:300px 1fr;height:calc(100vh - 210px);min-height:480px}}
.convos{display:flex;flex-direction:column;overflow:hidden}
.convos .l{overflow-y:auto;flex:1}
.cv{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:10px 14px;text-align:left;border-radius:12px}
.cv:hover{background:var(--canvas)}
.cv[aria-current="true"]{background:var(--brand-soft)}
.cv .t{flex:1;min-width:0}.cv .t b{display:block;font-size:14px}.cv .t span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv .meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:11px;color:var(--muted)}
.grp-av{background:var(--brand);color:#fff}
.thread{display:flex;flex-direction:column;overflow:hidden;min-height:60vh}
@media (min-width:900px){.thread{min-height:0}}
.thread-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.thread-h .t{flex:1;min-width:0}.thread-h .t b{display:block;font-size:15px}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--canvas)}
.e2e-note{align-self:center;max-width:320px;text-align:center;font-size:12px;color:var(--muted);background:var(--white);border-radius:12px;padding:8px 12px;margin-bottom:6px}
.bub{max-width:78%;display:flex;flex-direction:column;gap:3px}
.bub .b{border-radius:18px;padding:9px 13px;font-size:14px;line-height:1.4;background:var(--bubble-them);box-shadow:var(--shadow);overflow-wrap:anywhere}
.bub.me{align-self:flex-end;align-items:flex-end}.bub.me .b{background:var(--bubble-me);color:#fff}
.bub .who{font-size:11px;font-weight:700;color:var(--muted);padding:0 6px}
.bub .tm{font-size:11px;color:var(--muted);padding:0 6px}
.bub img{display:block;max-width:240px;width:100%;border-radius:14px}
.exp{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--warn);padding:0 6px}
.about{font-size:12px;font-weight:600;border-radius:10px;padding:4px 8px;background:rgb(28 25 23/.06);margin-bottom:4px;display:block}

 'cal-connect':()=>sheet('cc-t','Connect a calendar',`<p class="sm muted" style="margin:0">KinConnect reads your calendar and never changes it. Others see "Busy" unless you share titles.</p><div class="row">${B('cal-connect-save','Google','Connect Google Calendar','btn btn-p')}</div><div><label class="label" for="cc-ics">Apple or another calendar: paste its subscribe link</label><div class="row" style="flex-wrap:nowrap"><input class="input" id="cc-ics" placeholder="webcal://p12-caldav.icloud.com/published/2/…">${B('cal-connect-save','Apple','Add','btn btn-s')}</div></div>`),
 'cal-connect-save':v=>{if(v==='Apple'){const u=val('cc-ics');if(!/^(webcal|https?):\/\//.test(u)){toast('Paste a link that starts with webcal:// or https://');return;}}if(!S.calConnected.includes(v))S.calConnected.push(v);closeLayer();render();toast(`${v} calendar connected`);},
 feed:()=>{const f=S.feed;sheet('fd-t','Subscribe in your calendar',`<p class="sm muted" style="margin:0">Add the family schedule to your phone's calendar app. It updates on its own.</p><div class="copy"><code id="feed-url">webcal://kinconnect.app/feed/${f.token}/family.ics</code>${B('feed-copy',null,`${ic('copy',15)}Copy`)}</div><div><span class="label">Include</span><div class="row">${[['events','Events'],['birthdays','Birthdays'],['carpool','My carpool days'],['busy','Busy times']].map(k=>`<button class="chip c" data-a="feed-inc" data-v="${k[0]}" aria-pressed="${f[k[0]]}">${k[1]}</button>`).join('')}</div></div><ol class="sm" style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px"><li><b>iPhone:</b> Settings, Calendar, Accounts, Add Account, Other, Add Subscribed Calendar, then paste.</li><li><b>Google Calendar:</b> Other calendars, From URL, then paste.</li></ol><div class="row">${B('feed-reset',null,`${ic('refresh',14)}Make a new link`)}<span class="xs muted">The old link stops working. Do this if it was shared by mistake.</span></div>`);},
 'feed-inc':(v,el)=>{S.feed[v]=!S.feed[v];el.setAttribute('aria-pressed',S.feed[v]);},
 'feed-copy':()=>{const t=$('#feed-url').textContent;const sel=()=>{const r=document.createRange();r.selectNodeContents($('#feed-url'));const s=getSelection();s.removeAllRanges();s.addRange(r);};try{navigator.clipboard.writeText(t).then(()=>toast('Link copied'),()=>{sel();toast('Selected. Copy it from here.');});}catch(_){sel();toast('Selected. Copy it from here.');}},
 'feed-reset':()=>{S.feed.token=Math.random().toString(16).slice(2,10);A.feed();toast('New link made. The old one stopped working.');},
 dtab:v=>{S.dateTab=v;render();},
 'date-new':()=>sheet('dt-t','Add a date',`<div><label class="label" for="dt-who">Whose</label><select class="input" id="dt-who">${Object.keys(M).map(id=>`<option value="${id}">${esc(nm(id))}</option>`).join('')}</select></div><div><label class="label" for="dt-what">What</label><input class="input" id="dt-what" value="Birthday"></div><div><label class="label" for="dt-day">Date</label><input class="input" id="dt-day" type="date" value="2026-12-15"></div>${B('date-save',null,'Add date','btn btn-p','style="width:100%"')}`),
 'date-save':()=>{const w=val('dt-what'),d=val('dt-day');if(!w||!d){toast('Fill in what and when');return;}S.dates.push([val('dt-who'),w,d]);closeLayer();render();toast('Date added');},
 'ren-new':()=>sheet('rn-t','Add a renewal',`<div><label class="label" for="rn-who">Whose</label><select class="input" id="rn-who">${Object.keys(M).filter(id=>id===ME||sameHouse(id)).map(id=>`<option value="${id}">${id===ME?'Mine':esc(nm(id))}</option>`).join('')}</select></div><div><label class="label" for="rn-what">What</label><select class="input" id="rn-what">${["Driver's license",'Passport','Car tags','Car insurance','Home insurance','Prescription refill','Other'].map(x=>`<option>${x}</option>`).join('')}</select></div><div><label class="label" for="rn-due">Due</label><input class="input" id="rn-due" type="date" value="2027-01-31"></div><div><label class="label" for="rn-rem">Remind me</label><select class="input" id="rn-rem">${[7,14,30,60,90].map(n=>`<option value="${n}" ${n===30?'selected':''}>${n} days before</option>`).join('')}</select></div>${B('ren-save',null,'Add renewal','btn btn-p','style="width:100%"')}`),
 'ren-save':()=>{const d=val('rn-due');if(!d){toast('Pick the due date');return;}S.renewals.push({id:uid(),who:val('rn-who'),what:val('rn-what'),due:d,remind:+val('rn-rem')});closeLayer();render();toast('Renewal added. You\'ll get a reminder.');},
 'ren-done':v=>{const r=S.renewals.find(x=>x.id==v);if(!r)return;const yrs=/license/i.test(r.what)?6:/passport/i.test(r.what)?(S.kids.includes(r.who)?5:10):/refill/i.test(r.what)?0:1;const d=iso2d(r.due);if(yrs)d.setFullYear(d.getFullYear()+yrs);else d.setDate(d.getDate()+30);r.due=d.toISOString().slice(0,10);render();toast(`Nice. Next one is due ${fmtD(r.due,{month:'short',day:'numeric',year:'numeric'})}.`);},
 'gift-new':()=>sheet('gn-t','New gift list',`<div><label class="label" for="gn-name">Name</label><input class="input" id="gn-name" value="${esc(M[ME][1])}'s Christmas list"></div><div><label class="label" for="gn-items">What you'd like, one per line</label><textarea class="input" id="gn-items" placeholder="Slippers, size 9&#10;Puzzle, 1000 pieces"></textarea></div><div><label class="label" for="gn-to">Who can see it</label><select class="input" id="gn-to">${myCircles().map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>${B('gift-save',null,'Make list','btn btn-p','style="width:100%"')}`),
 'gift-save':()=>{const n=val('gn-name');const it=val('gn-items').split('\n').map(x=>x.trim()).filter(Boolean);if(!n){toast('Name the list');return;}if(!it.length){$('#gn-items').focus();toast('Add at least one thing');return;}S.gifts.unshift({id:uid('gl'),owner:ME,name:n,to:val('gn-to'),items:it.map(t=>({t,where:'',claim:null}))});closeLayer();render();toast('List made');},
 'gift-claim':v=>{const [g,i]=v.split(':');const it=S.gifts.find(x=>x.id===g).items[+i];if(it.claim){toast(`${fn(it.claim)} already claimed it`);render();return;}it.claim=ME;render();toast(`Claimed. ${fn(S.gifts.find(x=>x.id===g).owner)} won't see it.`);},
 'gift-add':v=>{const inp=$('#gadd-'+v);const t=inp.value.trim();if(!t){inp.focus();toast('Type something first');return;}S.gifts.find(x=>x.id===v).items.push({t,where:'',claim:null});inp.value='';render();$('#gadd-'+v)?.focus();toast(`Added ${t}`);},
 'gift-del':v=>{const [g,i]=v.split(':');const it=S.gifts.find(x=>x.id===g).items.splice(+i,1)[0];render();toast(`Removed ${it.t}`);},
 'gift-unclaim':v=>{const [g,i]=v.split(':');S.gifts.find(x=>x.id===g).items[+i].claim=null;render();},
 'santa-draw':()=>{const s=S.santa;const m=cById(s.circle).m;let pairs=null;for(let t=0;t<500&&!pairs;t++){const sh=[...m].sort(()=>Math.random()-.5);const ok=m.every((x,i)=>sh[i]!==x&&HOUSE[sh[i]]!==HOUSE[x]);if(ok)pairs=Object.fromEntries(m.map((x,i)=>[x,sh[i]]));}
   if(!pairs){toast("Couldn't find a fair drawing. Add more people from other households.");return;}s.pairs=pairs;s.drawn=true;s.shown={};render();toast(`Names drawn. Everyone in ${cById(s.circle).name} was told privately.`);},
 'santa-redraw':()=>confirmBox('Redraw everyone?','Everyone gets a new person, and anyone who already looked will be told it changed.','santa-yes','Redraw','btn-p'),
 'santa-yes':()=>{closeLayer();S.santa.drawn=false;A['santa-draw']();},
 'santa-reveal':()=>{S.santa.shown[ME]=true;render();},
 gtab:v=>{S.groTab=v;if(S.page!=='groceries')setPage('groceries');else render();},
 gtoggle:v=>{const l=S.lists.find(x=>x.id===v);l.open=!l.open;saveGroc();render();},
 'groc-all':()=>{const vis=S.lists.filter(sees);const o=!vis.every(l=>l.open);vis.forEach(l=>l.open=o);saveGroc();render();},
 groc:v=>{const [g,i]=v.split(':');const it=S.lists.find(x=>x.id===g).items[+i];if(!it)return;it[3]=!it[3];render();toast(it[3]?`${it[0]} is in the cart`:`${it[0]} is back on the list`);},
 add:v=>{const inp=$('#add-'+v);const t=inp.value.trim();if(!t){inp.focus();toast('Type an item first');return;}const l=S.lists.find(x=>x.id===v);if(t.length>80){toast('Keep items under 80 characters');return;}if(l.items.some(i=>i[0].toLowerCase()===t.toLowerCase()&&!i[3])){toast(`${t} is already on the list`);inp.select();return;}l.items.push([t,'',ME,false]);inp.value='';render();$('#add-'+v)?.focus();toast(`Added ${t}`);},
 shop:v=>{const on=S.shopping[v]===ME;if(on)delete S.shopping[v];else S.shopping[v]=ME;render();toast(on?'Marked done shopping':"Everyone on the list sees you're at the store");},
 'gl-make':()=>{const t=val('gl-title');if(!t){$('#gl-title').focus();toast('Name the run first');return;}const dv=val('gl-day');const id=uid('g');const to=val('gl-to');S.lists.unshift({id,title:t,by:ME,day:dv?fmtD(dv):'No day set',to,open:true,items:[]});$('#gl-title').value='';saveGroc();render();$('#add-'+id)?.focus();toast(`${t} sent to ${cById(to).name}`);},
 glist:v=>{const l=S.lists.find(x=>x.id===v);l.open=true;S.groTab='lists';saveGroc();setPage('groceries');setTimeout(()=>{$('#list-'+v)?.scrollIntoView({block:'start'});$('#add-'+v)?.focus({preventScroll:true});},0);},
 'meal-send':()=>{const l=S.lists.find(x=>x.id===val('meal-to'));if(!l)return;const have=new Set(l.items.map(i=>i[0].toLowerCase()));let n=0;const mp=meals();
   DAYS.filter(d=>mp[d]&&S.recipes[mp[d]]).forEach(d=>S.recipes[mp[d]].ings.forEach(([ing,amt])=>{if(!have.has(ing.toLowerCase())){have.add(ing.toLowerCase());l.items.push([ing,amt,ME,false]);n++;}}));
   toast(n?`Added ${n} ingredients to ${l.title}`:`${l.title} already has everything`);},
 recipe:v=>{const r=S.recipes[v];if(!r)return;const mp=meals();sheet('rc-t',esc(r.name),`<p class="xs muted" style="margin:-8px 0 0">From ${esc(fn(r.by))} · serves ${r.serves}</p><div><p class="label" style="margin:0 0 4px">Ingredients</p><ul class="sm" style="margin:0;padding-left:20px">${r.ings.map(i=>`<li>${esc(i[0])}${i[1]?`, ${esc(i[1])}`:''}</li>`).join('')}</ul></div><div><p class="label" style="margin:0 0 4px">Steps</p><ol class="sm" style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px">${r.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div><div class="row" style="flex-wrap:nowrap;align-items:flex-end"><div style="flex:1"><label class="label" for="rc-day">Plan it for</label><select class="input" id="rc-day">${DAYS.map(d=>`<option value="${d}" ${!mp[d]?'':''}>${d}${mp[d]&&S.recipes[mp[d]]?` (now: ${esc(S.recipes[mp[d]].name)})`:''}</option>`).join('')}</select></div>${B('recipe-plan',v,'Plan it','btn btn-p')}</div>`);},
 'recipe-plan':v=>{const d=val('rc-day');meals()[d]=v;closeLayer();render();toast(`${S.recipes[v].name} is on for ${d}`);},
 'recipe-new':()=>sheet('rn2-t','Add a recipe',`<div><label class="label" for="rp-name">Name</label><input class="input" id="rp-name" placeholder="Grandma's chicken and noodles"></div><div><label class="label" for="rp-ings">Ingredients, one per line. Add an amount after a comma.</label><textarea class="input" id="rp-ings" placeholder="Egg noodles, 2 bags&#10;Chicken thighs, 2 lb"></textarea></div><div><label class="label" for="rp-steps">Steps, one per line</label><textarea class="input" id="rp-steps"></textarea></div>${B('recipe-save',null,'Save recipe','btn btn-p','style="width:100%"')}`),
 'recipe-save':()=>{const n=val('rp-name');const ings=val('rp-ings').split('\n').map(x=>x.trim()).filter(Boolean).map(x=>{const i=x.indexOf(',');return i<0?[x,'']:[x.slice(0,i).trim(),x.slice(i+1).trim()];});if(!n){$('#rp-name').focus();toast('Name the recipe');return;}if(!ings.length){$('#rp-ings').focus();toast('Add at least one ingredient');return;}
   S.recipes[uid('r')]={name:n,by:ME,serves:4,ings,steps:val('rp-steps').split('\n').map(x=>x.trim()).filter(Boolean)};closeLayer();render();toast('Recipe saved to the family box');},
 chok:v=>{const c=S.chores.find(x=>x.id==v);if(!c||c.st!=='done')return;c.st='approved';S.bal[c.who]=(S.bal[c.who]||0)+c.amt;render();toast(`Okayed. ${fn(c.who)} earned ${money(c.amt)}`);},
 chback:v=>{const c=S.chores.find(x=>x.id==v);if(!c||c.st!=='done')return;c.st='todo';render();toast(`Sent back to ${fn(c.who)}`);},
 chdone:v=>{const c=S.chores.find(x=>x.id==v);if(!c||c.st!=='todo')return;c.st='done';render();},
 'ch-okall':()=>{const L=S.chores.filter(c=>c.st==='done'&&myKids().includes(c.who));L.forEach(c=>{c.st='approved';S.bal[c.who]=(S.bal[c.who]||0)+c.amt;});render();toast(`Okayed ${plural(L.length,'chore')}`);},
 'ch-new':()=>sheet('chn-t','Add chore',`<div><label class="label" for="chn-name">Chore</label><input class="input" id="chn-name" placeholder="Fold the laundry"></div><div class="row" style="align-items:flex-end"><div style="flex:1;min-width:140px"><label class="label" for="chn-who">Who</label><select class="input" id="chn-who">${myKids().map(k=>`<option value="${k}">${esc(nm(k))}</option>`).join('')}</select></div><div style="flex:1;min-width:110px"><label class="label" for="chn-amt">Pays</label><input class="input" id="chn-amt" type="number" min="0" step="0.5" value="2"></div><div style="flex:1;min-width:140px"><label class="label" for="chn-rep">Repeats</label><select class="input" id="chn-rep"><option>Daily</option><option>Weekly</option><option>Saturdays</option><option>Once</option></select></div></div>${B('chn-save',null,'Add chore','btn btn-p','style="width:100%"')}`),
 'chn-save':()=>{const n=val('chn-name');if(!n){$('#chn-name').focus();toast('Name the chore first');return;}const amt=+val('chn-amt');if(!(amt>=0)||amt>100){toast('Pay between $0 and $100');return;}S.chores.unshift({id:uid(),t:n,who:val('chn-who'),amt,rep:val('chn-rep'),st:'todo'});closeLayer();render();toast('Chore added');},
 payout:v=>{const amt=S.bal[v]||0;if(!amt)return;S.bal[v]=0;render();toast(`Recorded ${money(amt)} paid out to ${fn(v)}`);},
 'kid-done':v=>{const c=S.chores.find(x=>x.id==v);if(!c||c.st!=='todo')return;c.st='done';render();toast('Nice! Mom or Dad will okay it.');},
 'kid-undo':v=>{const c=S.chores.find(x=>x.id==v);if(!c||c.st!=='done')return;c.st='todo';render();},
 swap:v=>{const [rid,d]=v.split(':');const r=S.routes.find(x=>x.id===rid);const opts=Object.keys(M).filter(x=>x!==ME&&!S.kids.includes(x));sheet('sw-t',`Swap ${esc(r.name)}, ${d}`,`<p class="sm muted" style="margin:0">Who should take it? They get a request and can say yes or no.</p><div class="row">${opts.map(id=>`<button class="chip" data-a="swapto" data-v="${rid}:${d}:${id}">${av(id,28)}${esc(fn(id))}</button>`).join('')}</div>`);},
 swapto:v=>{const [rid,d,to]=v.split(':');const key=rid+d;if(S.swaps[key])return;const sw={to,ok:false};S.swaps[key]=sw;closeLayer();render();toast(`Asked ${fn(to)} to drive ${d}`);
   setTimeout(()=>{if(S.swaps[key]!==sw)return;sw.ok=true;rerenderIf('carpool','home');if(ME==='lb')toast(`${M[to][1]} said yes. They're driving ${d}.`);},3500);},
 'picked-up':()=>{if(S.pickedUp)return;S.pickedUp=true;S.alerts.unshift({id:uid(),kind:'update',by:ME,ago:'Just now',msg:'Picked up Ava from Irving Elementary.',to:cById('parents').m,open:false,readBy:[ME]});render();toast('Parents circle told: Ava is picked up');},
 'route-new':()=>sheet('rt-t','New route',`<div><label class="label" for="rt-name">Name</label><input class="input" id="rt-name" placeholder="Piano lessons"></div><div class="row"><div style="flex:1;min-width:140px"><label class="label" for="rt-time">Time</label><input class="input" id="rt-time" type="time" value="15:15"></div><div style="flex:2;min-width:160px"><label class="label" for="rt-where">Pickup spot</label><input class="input" id="rt-where" placeholder="Irving Elementary"></div></div><div><span class="label">Who drives each day (leave blank to skip)</span><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px">${DAYS.slice(0,5).map(d=>`<div><label class="label" for="rt-${d}">${d}</label><select class="input" id="rt-${d}"><option value="">Nobody</option>${Object.keys(M).filter(x=>!S.kids.includes(x)).map(id=>`<option value="${id}">${esc(fn(id))}</option>`).join('')}</select></div>`).join('')}</div></div><div><span class="label">For</span><div class="row">${S.kids.map(k=>chipP('rt-kid',k,PARENTS[k]&&PARENTS[k].includes(ME))).join('')}</div></div>${B('route-save',null,'Save route','btn btn-p','style="width:100%"')}`),
 'rt-kid':(v,el)=>el.setAttribute('aria-pressed',el.getAttribute('aria-pressed')!=='true'),
 'route-save':()=>{const n=val('rt-name');if(!n){$('#rt-name').focus();toast('Name the route');return;}const week={};DAYS.slice(0,5).forEach(d=>{const w=val('rt-'+d);if(w)week[d]=w;});if(!Object.keys(week).length){toast('Pick a driver for at least one day');return;}const kids=[...layer.querySelectorAll('[data-a="rt-kid"][aria-pressed="true"]')].map(b=>b.dataset.v);if(!kids.length){toast('Pick who it\'s for');return;}
   const [h,m]=(val('rt-time')||'15:00').split(':').map(Number);S.routes.push({id:uid('r'),name:n,when:`${Object.keys(week).join(', ')}, ${h%12||12}:${String(m).padStart(2,'0')} ${h<12?'AM':'PM'}`,where:val('rt-where')||'Pickup spot to be set',kids,week});closeLayer();render();toast('Route saved');},
 'pet-fed':v=>{const [p,i]=v.split(':');const m=S.pets.find(x=>x.id===p).meals[+i];if(m.by)return;m.by=ME;m.when='just now';render();toast(`Marked fed. Everyone can see it.`);},
 'pet-med':v=>{const [p,i]=v.split(':');const m=S.pets.find(x=>x.id===p).meds[+i];if(m.given)return;m.given=ME;render();toast('Marked given');},
 'pet-sit':v=>{const p=S.pets.find(x=>x.id===v);sheet('ps-t',`Who's watching ${esc(p.name)}?`,`<div><span class="label">Pet-sitter</span><div class="row">${Object.keys(M).filter(x=>!sameHouse(x)||x===ME).map((id,i)=>`<button class="chip" data-a="ps-who" data-v="${id}" aria-pressed="${i===0}">${av(id,28)}${esc(fn(id))}</button>`).join('')}</div></div><div><label class="label" for="ps-when">When</label><input class="input" id="ps-when" placeholder="Fri, Nov 6 to Sun, Nov 8"></div><p class="xs muted" style="margin:0">They get the feeding times, medicine, vet number and care notes.</p>${B('pet-sit-save',v,'Ask them','btn btn-p','style="width:100%"')}`);},
 'ps-who':(v,el)=>layer.querySelectorAll('[data-a="ps-who"]').forEach(b=>b.setAttribute('aria-pressed',b===el)),
 'pet-sit-save':v=>{const w=val('ps-when');if(!w){$('#ps-when').focus();toast('Say when');return;}const who=layer.querySelector('[data-a="ps-who"][aria-pressed="true"]').dataset.v;S.pets.find(x=>x.id===v).sitter={who,when:w};closeLayer();render();toast(`Asked ${fn(who)}. They got the care notes.`);},
 'pet-sit-end':v=>{S.pets.find(x=>x.id===v).sitter=null;render();},
 'pet-notes':v=>{const p=S.pets.find(x=>x.id===v);sheet('pn-t',`${esc(p.name)}'s care notes`,`<div><label class="label" for="pn-notes">Notes for whoever is watching</label><textarea class="input" id="pn-notes" rows="4">${esc(p.notes)}</textarea></div><div class="row"><div style="flex:1;min-width:160px"><label class="label" for="pn-vet">Vet</label><input class="input" id="pn-vet" value="${esc(p.vet)}"></div><div style="flex:1;min-width:140px"><label class="label" for="pn-phone">Vet phone</label><input class="input" id="pn-phone" type="tel" value="${esc(p.vetPhone)}"></div></div>${B('pet-notes-save',v,'Save','btn btn-p','style="width:100%"')}`);},
 'pet-notes-save':v=>{const p=S.pets.find(x=>x.id===v);p.notes=val('pn-notes');p.vet=val('pn-vet');p.vetPhone=val('pn-phone');closeLayer();render();toast('Care notes saved');},
 'led-new':()=>sheet('led-t','Add an entry',`<div class="row" style="align-items:flex-end"><div style="flex:1;min-width:140px"><label class="label" for="led-from">Who owes</label><select class="input" id="led-from">${Object.keys(M).map(id=>`<option value="${id}" ${id===ME?'selected':''}>${id===ME?'You':esc(nm(id))}</option>`).join('')}</select></div><div style="flex:1;min-width:140px"><label class="label" for="led-to">Owes</label><select class="input" id="led-to">${Object.keys(M).map(id=>`<option value="${id}" ${id==='jb'?'selected':''}>${id===ME?'You':esc(nm(id))}</option>`).join('')}</select></div></div><div class="row" style="align-items:flex-end"><div style="flex:2;min-width:160px"><label class="label" for="led-what">For</label><input class="input" id="led-what" placeholder="Movie tickets"></div><div style="flex:1;min-width:110px"><label class="label" for="led-amt">Amount</label><input class="input" id="led-amt" type="number" min="0" step="0.01" placeholder="0.00"></div></div>${B('led-save',null,'Add entry','btn btn-p','style="width:100%"')}`),

  const el=e.target.closest('[data-a]');
  if(!el){if(S.reactOpen&&!e.target.closest('.rbar')){S.reactOpen=null;render();}return;}
  if(el.disabled||el.getAttribute('aria-disabled')==='true')return;
  // A second tap on the same spot right after a panel closed would otherwise land on whatever was underneath.
  if(performance.now()-layerClosedAt<350&&!el.closest('#layer')&&closeXY&&Math.hypot(e.clientX-closeXY[0],e.clientY-closeXY[1])<40)return;
  const f=A[el.dataset.a];if(!f){console.warn('No action for',el.dataset.a);return;}
  if(el.tagName==='A')return;
  const now=performance.now();
  // Tap-through guard: if the last tap re-drew the list, a second tap of the same kind within 350 ms lands on whatever slid under the finger. Ignore it.
  if(lastAct&&now-lastAct.t<350&&el!==lastAct.el&&el.dataset.a===lastAct.a&&!lastAct.el.isConnected&&ROW_ACTS.has(el.dataset.a))return;
  lastAct={t:now,a:el.dataset.a,el};

/* ---------- small helpers ---------- */
const callBtn=(id,cls='btn-sm',label)=>PHONE[id]&&id!==ME?B('call',id,`${ic('call',cls.startsWith('s-')?22:15)}${label||'Call '+esc(fn(id))}`,cls):'';
const sayBtn=(text,cls='icbtn',label)=>`<button class="${cls}" data-a="say" data-say="${esc(text)}" aria-label="Read aloud">${ic('volume',cls.startsWith('s-')?22:18)}${label||''}</button>`;
const feelSet=(id=ME)=>S.feel.set[id]||(S.feel.set[id]={on:false,time:'9:00 AM',share:[]});
const todayFeel=(id=ME)=>(S.feel.log[id]||[]).find(x=>x.d===TODAY_ISO);
const feelVisible=()=>Object.keys(S.feel.set).filter(id=>id!==ME&&S.feel.set[id].on&&S.feel.set[id].share.includes(ME));

const pill2=(t,bg,fg)=>`<span class="pill" style="background:${bg};color:${fg}">${t}</span>`;

/* ---------- daily feeling question ---------- */
function feelCard(big){
  const st=feelSet();if(!st.on)return '';const t=todayFeel();const names=st.share.map(fn).join(', ')||'nobody yet';
  if(t){if(!big)return '';return `<div class="s-w"><span class="k">${ic('smile',18)}Today</span><p>You said you feel <b style="color:${FEEL[t.v][1]}">${FEEL[t.v][0]}</b>.</p><p class="m">${esc(names)} can see this.</p><div class="s-row">${B('feel-reset',null,'Change my answer','s-btn s')}</div></div>`;}
  const btns=Object.entries(FEEL).map(([k,f])=>`<button class="${big?'feelbtn big':'feelbtn'}" data-a="feel" data-v="${k}" style="--fc:${f[1]}"><span class="fdot"></span>${f[0]}</button>`).join('');
  return big?`<section class="s-card"><h2>How do you feel today?</h2><div class="feelgrid">${btns}</div><p class="m" style="font-size:16px;color:var(--muted)">${esc(names)} will see your answer.</p></section>`
   :sec('How do you feel today?',`<div class="feelgrid sm">${btns}</div><p class="xs muted" style="margin:10px 0 0">${esc(names)} will see your answer.</p>`);
}
function feelFollowUp(){
  const body=`<div><label class="label" for="feel-note" style="${simple()?'font-size:17px':''}">Want to say more? (optional)</label><textarea class="input ${simple()?'s-input':''}" id="feel-note" placeholder="My hip hurts again"></textarea></div><div class="s-st" style="grid-template-columns:1fr">${B('feel-ok',null,"Yes, I'm OK. Just not a great day",simple()?'s-btn s':'btn btn-s')}${B('feel-help',null,`${ic('alert',simple()?24:18)}I need help`,simple()?'s-btn help':'btn btn-y')}${B('feel-call',null,`${ic('call',simple()?24:18)}Call someone`,simple()?'s-btn p':'btn btn-p')}</div>`;
  if(simple())simpleSheet('fo-t','Are you OK?',body,"We're sorry you're not feeling well.");else sheet('fo-t','Are you OK?',`<p class="sm muted" style="margin:-8px 0 0">Sorry you're not feeling well.</p>${body}`);
}
function feelPage(){
  const ppl=[...(feelSet().on?[ME]:[]),...feelVisible()];
  const rows=ppl.map(id=>{const log=S.feel.log[id]||[];const t=log.find(x=>x.d===TODAY_ISO);const last=[...log].reverse().find(x=>x.note);
    return `<li class="row between" style="align-items:flex-start;flex-wrap:nowrap"><span style="min-width:0;flex:1"><b class="sm">${id===ME?'You':esc(dn(id))}</b> ${t?pill2(FEEL[t.v][0],FEEL[t.v][1]+'1f',FEEL[t.v][1]):pill2('No answer yet today','var(--stone-100)','var(--muted)')}${t&&t.follow?` <span class="xs muted">· ${esc(t.follow)}</span>`:''}<span class="dots" style="display:flex;margin-top:8px" aria-label="Last 7 days">${LAST7.map(d=>{const e=log.find(x=>x.d===d);return `<span title="${fmtD(d)}: ${e?FEEL[e.v][0]:'no answer'}" style="background:${e?FEEL[e.v][1]:'var(--stone-300)'}"></span>`}).join('')}</span>${last?`<span class="xs muted" style="display:block;margin-top:6px">"${esc(last.note)}" · ${fmtD(last.d)}</span>`:''}</span>${id!==ME?callBtn(id):''}</li>`;}).join('');
  return sec('How everyone is feeling',ppl.length?`<ul class="plain div">${rows}</ul><p class="xs muted" style="margin:12px 0 0">Each person picks who sees their answers in Settings. Dots are the last 7 days.</p>`:'<p class="sm muted" style="margin:0">Nobody shares a daily check-in with you yet.</p>',B('go','settings','Settings','lnk'));
}

/* ---------- medicine reminders ---------- */
function medsCard(big){
  const mine=S.meds2.filter(m=>m.who===ME&&!m.taken);if(!mine.length)return '';
  const w=mine[0].watch.map(fn).join(', ');
  if(big)return mine.map(m=>`<div class="s-w"><span class="k">${ic('pill',18)}Medicine</span><p>Did you take your <b>${esc(m.t.toLowerCase())}</b>? It was due at ${m.at}.</p>${m.watch.length?`<p class="m">If it isn't checked off by 10:00 AM, ${esc(w)} get a reminder to check on you.</p>`:''}<div class="s-row">${B('med-took',m.id,`${ic('check',22)}Yes, I took it`,'s-btn ok')}${B('med-snooze',m.id,'Remind me in 30 minutes','s-btn s')}</div></div>`).join('');
  return sec('My medicine',`<ul class="plain div">${mine.map(m=>`<li class="row between"><span class="sm"><b>${esc(m.t)}</b> <span class="muted">· due ${m.at}</span></span><span class="row">${B('med-snooze',m.id,'Later')}${B('med-took',m.id,`${ic('check',14)}Took it`,'btn-sm p')}</span></li>`).join('')}</ul>`);
}

/* ---------- needs you / feed extras ---------- */
function extraNeeds(row){
  const out=[];
  feelVisible().forEach(id=>{const t=todayFeel(id);if(t&&['notgreat','bad'].includes(t.v))out.push(row('smile',`${esc(fn(id))} said ${id==='gj'?'she':'they'}'s feeling <b style="color:${FEEL[t.v][1]}">${FEEL[t.v][0].toLowerCase()}</b> today${t.follow?` · ${esc(t.follow.toLowerCase())}`:''}`,callBtn(id)||B('dm',id,'Message')));});
  S.meds2.filter(m=>m.watch.includes(ME)&&!m.taken&&m.who!==ME).forEach(m=>out.push(row('pill',`${esc(fn(m.who))} hasn't checked off <b>${esc(m.t.toLowerCase())}</b> (${m.at})`,`<span class="row">${B('med-nudge',m.id,'Remind')}${callBtn(m.who,'btn-sm','Call')}</span>`)));
  S.upkeep.filter(u=>u.who===ME&&daysTo(u.due)<=21).forEach(u=>out.push(row('wrench',`<b>${esc(u.t)}</b> is ${dueText(daysTo(u.due))}`,B('up-done',u.id,'Done'))));
  S.redeems.filter(r=>r.st==='pending'&&myKids().includes(r.kid)).forEach(r=>{const w=S.rewards.find(x=>x.id===r.reward);out.push(row('star',`${esc(fn(r.kid))} wants to spend ${pts(w.cost)} on <b>${esc(w.t.toLowerCase())}</b>`,`<span class="row">${B('rd-no',r.id,'Not now')}${B('rd-yes',r.id,'Okay','btn-sm p')}</span>`));});
  schoolKids().forEach(k=>S.school[k].dates.filter(d=>daysTo(d[0])>=0&&daysTo(d[0])<=14).forEach(d=>out.push(row('school',`${esc(fn(k))}: <b>${esc(d[1])}</b>, ${fmtD(d[0])}`,B('go','school','School','lnk')))));
  return out;
}
function extraFeed(){
  const w=[];
  if(!S.stories.some(s=>s.by===ME&&s.q===S.storyQ))w.push(`<div class="s-w"><span class="k">${ic('mic',18)}This week's question for you</span><p><b>${esc(S.storyQ)}</b></p><p class="m">Your answer is saved for the whole family to keep.</p><div class="s-row">${B('story-new',null,`${ic('mic',22)}Answer by voice`,'s-btn p')}</div></div>`);
  Object.entries(S.cards).forEach(([key,c])=>{if(c.who!==ME&&!c.sigs.some(s=>s[0]===ME)&&daysTo(key.slice(3))<=14)w.push(`<div class="s-w"><span class="k">${ic('cake',18)}Card to sign</span><p>Sign ${esc(fn(c.who))}'s ${esc(c.what.toLowerCase())} card. ${plural(c.sigs.length,'person has','people have')} signed.</p><div class="s-row">${B('card',key,`${ic('edit',22)}Sign the card`,'s-btn p')}</div></div>`);});
  const th=S.thanks[0];if(th)w.push(`<div class="s-w"><span class="k">${ic('heart',18)}Thank-you wall</span><p><b>${esc(fn(th.from))}</b> thanked <b>${esc(fn(th.to))}</b>: "${esc(th.t)}"</p><div class="s-row">${B('heart',th.id,`${ic('heart',22)}${th.hearts.includes(ME)?'You loved this':'Love it'}`,'s-btn '+(th.hearts.includes(ME)?'p':'s'))}${B('thanks-new',null,'Thank someone','s-btn s')}</div></div>`);

/* ---------- calls and read aloud ---------- */
function callSheet(id){const num=PHONE[id];const tel='tel:+1'+num.replace(/\D/g,'');const body=`<p class="${simple()?'s-sub':'sm muted'}" style="margin:0">${esc(dn(id))}</p><p style="margin:0;font-size:${simple()?'34px':'26px'};font-weight:800;font-variant-numeric:tabular-nums;user-select:all">${esc(num)}</p><a class="${simple()?'s-btn ok':'btn btn-p'}" href="${tel}" style="width:100%">${ic('call',simple()?24:18)}Confirm to call</a>${B('close',null,'Cancel',simple()?'s-btn s':'btn btn-s','style="width:100%"')}<p class="${simple()?'m':'xs muted'}" style="margin:0;${simple()?'font-size:16px;color:var(--muted)':''}">If your phone doesn't start the call, dial the number above.</p>`;
  if(simple())simpleSheet('call-t',`Call ${esc(fn(id))}?`,body);else sheet('call-t',`Call ${esc(fn(id))}?`,body);}
function speak(text){try{if(!('speechSynthesis' in window))throw 0;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=.92;speechSynthesis.speak(u);toast('Reading aloud');}catch(_){toast("This device can't read aloud");}}
function homeSummary(){const parts=[`Good morning, ${M[ME][1]}.`];const t=todayFeel();if(feelSet().on&&!t)parts.push("Tell your family how you feel today.");
  S.meds2.filter(m=>m.who===ME&&!m.taken).forEach(m=>parts.push(`Don't forget your ${m.t.toLowerCase()}.`));
  openAlerts().forEach(a=>parts.push(`${a.by===ME?'You':fn(a.by)} sent an emergency: ${a.msg}`));
  const uc=unreadChats(),ua=unreadAlerts();if(uc)parts.push(`You have ${plural(uc,'new message')}.`);if(ua)parts.push(`You have ${plural(ua,'new alert')}.`);
  S.lists.filter(sees).forEach(l=>{const last=l.items[l.items.length-1];if(last)parts.push(`${fn(last[2])} added ${last[0]} to ${l.title}.`);});
  comingUp(2).forEach(e=>parts.push(`Coming up: ${e.t}, ${e.when}.`));return parts.join(' ');}

/* ---------- offline and saving ---------- */
const SAVE_KEY='kc-preview-v5';
const UI_KEYS=new Set(['page','chat','groTab','famTab','dateTab','ledTab','choreTab','upTab','rec','play','reactOpen','pendingImg','about','offline','queue','ask']);
const changeSnap=()=>{try{return JSON.stringify(S,(k,v)=>UI_KEYS.has(k)?undefined:v);}catch(_){return '';}};
let saveT;
function persist(){{const data={v:5,ME,names:Object.fromEntries(Object.keys(M).map(k=>[k,M[k][0]])),S:JSON.parse(JSON.stringify(S,(k,v)=>['rec','play','reactOpen','pendingImg'].includes(k)?undefined:v===SAMPLE_IMG?'sample':v))};
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(data));}catch(_){try{data.S.chats.forEach(c=>c.msgs.forEach(m=>{if(m.img&&m.img!=='sample')m.img=null;}));localStorage.setItem(SAVE_KEY,JSON.stringify(data));}catch(__){}}}}
const savedSize=()=>{try{return (localStorage.getItem(SAVE_KEY)||'').length;}catch(_){return 0;}};
function loadSaved(){try{const raw=localStorage.getItem(SAVE_KEY);if(!raw)return;const d=JSON.parse(raw);if(d.v!==5)return;
  const ok={};Object.entries(d.S||{}).forEach(([k,v])=>{const cur=S[k];if(cur===undefined||v===null&&cur!==null)return;if(Array.isArray(cur)!==Array.isArray(v))return;if(typeof cur!==typeof v)return;ok[k]=v;});
  if(ok.chats&&!ok.chats.every(c=>c&&Array.isArray(c.msgs)&&Array.isArray(c.members)))delete ok.chats;
  if(ok.lists&&!ok.lists.every(l=>l&&Array.isArray(l.items)))delete ok.lists;
  (ok.chats||[]).forEach(c=>c.msgs.forEach(m=>{if(m.img==='sample')m.img=SAMPLE_IMG;}));Object.assign(S,ok);S.offline=false;
  Object.entries(d.names||{}).forEach(([k,n])=>{if(M[k])M[k][0]=n;});if(M[d.ME])ME=d.ME;$('#viewas').value=ME;S.page=S.page&&V[S.page]?S.page:'home';syncStorm();}catch(_){}}

  // thanks
  const th=t.match(/ (?:thank|thanks) (.+)$/);
  if(th&&who.length){const id=who[0];const why=raw.replace(/^.*?\bthanks?\b\s*/i,'').replace(new RegExp('^'+M[id][1]+'\\s*','i'),'').replace(/^for\s*/i,'').trim();const post={id:uid('t'),from:ME,to:id,t:why?`Thank you for ${why}`:'Thank you!',ago:'Just now',hearts:[]};
    return {icon:'heart',title:`Thanked ${dn(id)}`,steps:[`Wrote: "${post.t}"`,'Posted on the thank-you wall'],mode:'done',run:()=>S.thanks.unshift(post),undo:()=>{S.thanks=S.thanks.filter(x=>x!==post);}};}
  // card
  if(/ card /.test(t)&&who.length){const key=Object.keys(S.cards).find(k=>S.cards[k].who===who[0]);if(key)return {icon:'cake',title:`Opening ${fn(who[0])}'s card`,steps:[`Found ${fn(who[0])}'s ${S.cards[key].what.toLowerCase()} card`],mode:'open',run:()=>A.card(key)};}
  // read aloud
  if(/ read /.test(t))return {icon:'volume',title:'Reading your updates',steps:['Gathered what is new','Reading it out loud'],mode:'open',run:()=>{closeLayer();speak(homeSummary());}};
  // look up
  if(/ (coming up|happening|this week|calendar|schedule|what's next|whats next) /.test(t))return {icon:'cal',title:"Here's what is coming up",steps:['Opened your calendar'],mode:'open',run:()=>sCal()};
  if(/ (everyone|where is|how is|family) /.test(t)&&!who.length)return {icon:'users',title:'Here is your family',steps:['Opened your family list'],mode:'open',run:()=>sFamily()};
  if(who.length&&/ (where|how) /.test(t)){const s=S.status[who[0]];return {icon:'users',title:`${dn(who[0])}: ${s?ST[s[0]][0]+(s[1]?', '+s[1]:''):'not sharing a status'}`,steps:[`Checked ${fn(who[0])}'s status`,s?`Updated ${s[2]}`:''].filter(Boolean),mode:'none'};}
  // pages
  const key=Object.keys(KH_PAGES).find(k=>t.includes(' '+k+' ')||t.includes(' '+k+'s '));
  if(key){const pg=KH_PAGES[key];if(!allowed(pg))return null;const from=S.page;return {icon:NAVK[pg][2],title:`Opened ${NAVK[pg][1]}`,steps:[`Found ${NAVK[pg][1]}`,'Took you there'],mode:'go',run:()=>{if(pg==='groceries'&&/recipe/.test(key))S.groTab='recipes';if(pg==='family'&&key==='stories')S.famTab='stories';if(pg==='family'&&key==='tree')S.famTab='tree';setPage(pg);},undo:()=>setPage(from)};}
  return null;
}
function khShow(p){
  const delay=i=>300+i*480;const n=p.steps.length;
  let acts;
  if(p.choices)acts=p.choices.map(c=>B('kh-pick',c[1],esc(c[0]),'s-btn s')).join('');
  else if(p.mode==='done')acts=B('kh-ok',null,`${ic('check',22)}Yes, that's right`,'s-btn ok')+B('kh-undo',null,'Undo','s-btn s');
  else if(p.mode==='call'){const tel='tel:+1'+PHONE[p.who].replace(/\D/g,'');acts=`<a class="s-btn ok" href="${tel}" data-kh-call="1">${ic('call',24)}Confirm to call</a>`+B('close',null,'Cancel','s-btn s');}
  else if(p.mode==='go')acts=B('kh-ok',null,"That's right",'s-btn ok')+B('kh-undo',null,'Not what I meant','s-btn s');
  else acts=B('close',null,'Okay','s-btn p');
  simpleSheet('kh-t',`<span class="kh-title">${mark(32)}KinHelper</span>`,`<div class="kh-stage"><span class="kh-ic">${ic(p.icon,44)}<span class="kh-ring"></span></span><p class="kh-say">${esc(p.title)}</p></div>${n?`<ol class="kh-steps">${p.steps.map((s,i)=>`<li style="animation-delay:${delay(i)}ms"><span class="kh-ck" style="animation-delay:${delay(i)}ms"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" style="animation-delay:${delay(i)+120}ms"/></svg></span>${esc(s)}</li>`).join('')}</ol>`:''}<div class="s-st kh-acts" style="grid-template-columns:1fr;animation-delay:${delay(n)}ms">${acts}</div>`,p.heard?`You said: "${esc(p.heard)}"`:'');
}
function khRun(text,force){
  text=(text||'').trim();if(!text){$('#kh-in')?.focus();toast('Say or type what you want to do');return;}
  const p=khPlan(text,force);
  if(!p){simpleSheet('kh-t',`<span class="kh-title">${mark(32)}KinHelper</span>`,`<p style="font-size:19px;margin:0">I'm not sure how to do that yet. Try one of these:</p><div class="s-st" style="grid-template-columns:1fr">${['Call Rick','Add milk to the list',"I'm OK",'Tell Jess thank you',"What's coming up?",'Open pets'].map(x=>B('kh-try',x,esc(x),'s-btn s')).join('')}</div>`,`You said: "${esc(text)}"`);return;}
  p.heard=text;KH.plan=p;
  if(p.mode==='open'){p.run();return;}
  if(p.mode==='go'){p.run();}
  else if(p.mode==='done'){p.run();render();}
  khShow(p);const i=$('#kh-in');if(i)i.value='';
}
function khBar(){return `<section class="khbar"><label for="kh-in" class="kh-l">${mark(28)}<span>What do you want to do?</span></label><div class="kh-row"><input class="input s-input" id="kh-in" data-enter="kh-go" placeholder="Like: call Rick, or add milk" autocomplete="off" enterkeyhint="go"><button class="s-btn s kh-mic" data-a="kh-mic" aria-label="Say it out loud">${ic('mic',26)}</button></div>${B('kh-go',null,'Do it','s-btn p','style="width:100%"')}<div class="kh-sug">${['Call Rick','Add milk to the list',"I'm OK","What's coming up?"].map(x=>`<button class="chip c" data-a="kh-try" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div></section>`;}
Object.assign(A,{
 'kh-go':()=>khRun(val('kh-in')),
 'kh-try':v=>{closeLayer();const i=$('#kh-in');if(i)i.value=v;khRun(v);},
 'kh-pick':v=>{closeLayer();const i=v.indexOf('|');khRun(v.slice(i+1),v.slice(0,i));},
 'kh-ok':()=>{const p=KH.plan;KH.plan=null;closeLayer();toast('Done. Thank you!');if(p&&p.after)p.after();},
 'kh-undo':()=>{const p=KH.plan;KH.plan=null;closeLayer();if(p&&p.undo){p.undo();render();toast('Undone. Nothing changed.');}},
 'kh-mic':()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;const fail=()=>toast("Voice isn't available here. Tap the microphone on your keyboard, or type it.");if(!R){fail();return;}
   try{const r=new R();r.lang='en-US';r.interimResults=false;r.onresult=e=>{const txt=e.results[0][0].transcript;const i=$('#kh-in');if(i)i.value=txt;khRun(txt);};r.onerror=fail;r.start();toast('Listening…');}catch(_){fail();}},
});
/* KinHelper sits at the top of the simple home screen */
const _simpleHome=simpleHome;
simpleHome=function(){const h=_simpleHome();const i=h.indexOf('</div>');return h.slice(0,i+6)+khBar()+h.slice(i+6);};

const _settingsV=V.settings;
V.settings=function(){const h=_settingsV();if(!isKid())return h;const i=h.indexOf('<section class="card"><div class="sec-h"><h2>Text-message backup');if(i<0)return h;const j=h.indexOf('<section class="card">',i+10);return h.slice(0,i)+h.slice(j);};

loadSaved();
(function flushOnLaunch(){const n=S.alerts.filter(a=>a.pending).length+S.chats.reduce((x,c)=>x+c.msgs.filter(m=>m.pending).length,0);S.alerts.filter(a=>a.pending).forEach(a=>{a.pending=false;simReply(a);});S.chats.forEach(c=>c.msgs.forEach(m=>{if(m.pending){m.pending=false;seenSim(c,m);}}));S.queue=0;if(n){persist();setTimeout(()=>toast(`Back online. Sent ${plural(n,'thing')} that was waiting.`),300);}})();

render();
</script>
